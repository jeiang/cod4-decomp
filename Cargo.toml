[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Install-gated tests inflate whole zones / decode thousands of files; debug-mode takes minutes.
[profile.dev.package.gsc]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.assets]
opt-level = 3

# The harness video recorder (scaling + RGB->YUV + software AV1) is unusably slow at opt-level 0.
[profile.dev.package.client]
opt-level = 1
[profile.dev.package.rav1e]
opt-level = 3
[profile.dev.package.v_frame]
opt-level = 3
