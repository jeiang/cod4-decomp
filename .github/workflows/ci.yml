name: ci
on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml (channel, components, targets) on first cargo call.
      - run: rustup show active-toolchain || rustup toolchain install
      - run: choco install nasm -y --no-progress
      - run: echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo fmt --check
      - run: cargo build --release -p harness -p client -p server
      - name: Collect harness folder
        shell: bash
        run: |
          mkdir cod4e-harness-windows
          cp target/release/{cod4e-harness,cod4e,cod4e-server}.exe cod4e-harness-windows/
          cp crates/harness/PORTABLE-README.txt cod4e-harness-windows/README.txt
          ./cod4e-harness-windows/cod4e-harness.exe stages > cod4e-harness-windows/STAGES.txt
          echo "${GITHUB_SHA}" > cod4e-harness-windows/BUILD.txt
      # The tester's path: double-click is a run with no arguments. With no
      # install it must still write a bundle that says so (exit status 1).
      - name: Smoke the portable folder with no install
        shell: bash
        working-directory: cod4e-harness-windows
        env:
          COD4E_NO_PROMPT: "1"
        run: |
          set +e
          ./cod4e-harness.exe < /dev/null
          [ $? -eq 1 ] || { echo "expected exit status 1"; exit 1; }
          python -c "import glob,zipfile; z=glob.glob('cod4e-run-*.zip'); assert len(z)==1, z; a=zipfile.ZipFile(z[0]); n=a.namelist(); print(n); assert 'manifest.json' in n and 'summary.json' in n; assert b'install not found' in a.read('harness.log')"
          mkdir ../ci-bundle && mv cod4e-run-*.zip ../ci-bundle/
      - uses: actions/upload-artifact@v4
        with:
          name: cod4e-ci-bundle
          path: ci-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: cod4e-harness-windows
          path: cod4e-harness-windows
      # Rolling tester build: every push to main replaces the assets of the
      # `windows-tester` prerelease, so the tester link never changes.
      - name: Publish the windows-tester prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          7z a -tzip cod4e-windows-tester.zip ./cod4e-harness-windows/* > /dev/null
          notes="Built from ${GITHUB_SHA} on $(date -u +%Y-%m-%d). Unzip, double-click cod4e-harness.exe, send back the cod4e-run-*.zip it writes. Stages: see STAGES.txt."
          if gh release view windows-tester > /dev/null 2>&1; then
            gh release upload windows-tester cod4e-windows-tester.zip --clobber
            gh release edit windows-tester --notes "$notes"
          else
            gh release create windows-tester cod4e-windows-tester.zip --prerelease --title "Windows tester build" --notes "$notes"
          fi
