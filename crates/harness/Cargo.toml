[package]
name = "harness"
description = "Runs scenarios and writes run bundles."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "cod4e-harness"
path = "src/main.rs"

[dependencies]
logging = { path = "../logging" }
assets = { version = "0.0.0", path = "../assets" }
server = { version = "0.0.0", path = "../server" }
net = { version = "0.0.0", path = "../net" }
master = { path = "../master" }
install = { path = "../install", features = ["prompt"] }
sim = { version = "0.0.0", path = "../sim" }
crash-handler = "0.8.1"
minidumper = "0.11.0"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
