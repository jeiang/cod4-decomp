// Search and Destroy objectives with bots: the carrier holds +activate in a bomb zone until the
// bomb is planted, and a defender holds it at the bomb until it is defused. The server runs
// unpaced until each happens (a bomb needs both teams alive at the zones, which takes a few rounds).
set g_gametype sd
set scr_sd_timelimit 0
set scr_sd_scorelimit 0
set scr_sd_roundlimit 0
map mp_crash
bots 12
until plants 1 2000
until defuses 1 2000
expect plants 1
expect defuses 1
quit
