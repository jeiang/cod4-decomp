// Sabotage objectives with bots: a bot carries the bomb to the enemy base and holds +activate at its bomb zone
// until it is planted, and a bot of the other team holds +activate at the planted bomb until it is defused. The
// bots stand still (`bot_idle`) and are put in place with `devtele`, because left alone they plant and defuse only
// when the carrier and then a defender happen to survive the fighting: at some bot counts a run of 2000 s never
// got a defuse. The bots' teams are a random pick, so the steps name a team (`axis` carries to the Allies' zone,
// `allies` defuses there) rather than a bot number. Idle bots hold +activate under a use trigger's hint; `devrun`
// lets each step happen before the next.
set g_gametype sab
set scr_sab_timelimit 0
set scr_sab_scorelimit 0
map mp_crash
bots 8
// Bots pick their teams only after the level's first seconds, and play once the prematch countdown is over.
until playing 8 60
set bot_idle 1
// A bot that has only just spawned does not take the bomb: let the round settle first.
devrun 3
devtele axis sab_bomb_pickup
devrun 2
devtele axis sab_bomb_allies
until plants 1 30
expect plants 1
devtele allies sab_bomb_allies
until defuses 1 60
expect defuses 1
quit
