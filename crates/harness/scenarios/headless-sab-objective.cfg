// Sabotage objectives with bots: a carrier plants at the enemy base (holding +activate at its
// bomb zone) and a defender of that base defuses the bomb. The server runs unpaced until each happens.
set g_gametype sab
set scr_sab_timelimit 0
set scr_sab_scorelimit 0
map mp_crash
bots 16
# Like Search and Destroy: a plant needs a carrier that lives, a defuse a defender that does.
until plants 1 600
until defuses 1 2000
expect plants 1
expect defuses 1
quit
