// Server budget check: a full 32-player TDM match on mp_crash (run under one core and 512 MB).
//
// The install's own `default_mp_gamesettings.cfg` lowers `sv_maxclients` to 24 for a fresh server, so the 32 slots
// are asked for before the map (the dvar is latched: the map applies it). The budget is the stock one,
// `sv_maxclients` 32 (`g_main_mp.cpp`, KisakCOD). Bots pick a team after five seconds of level time, so the check
// waits until all 32 of them are in the match with their controls, not merely connected.
set sv_maxclients 32
set g_gametype war
set scr_war_timelimit 10
map mp_crash
bots 32
until playing 32 90
wait 90s
status
expect kills 1
quit
