// The helicopter hardpoint with bots: a bot is given it as a killstreak reward, selects it from action slot 4 and
// calls it in; it flies the map's path, fires at the other team and the bots shoot it down. Its health is cut so a
// few bots can do it, but not so far that they bring it down before it has fired once (at 60 they did, on some
// seeds: the helicopter crashed with no shot). The server runs unpaced.
set g_gametype war
set scr_war_timelimit 0
set scr_war_scorelimit 0
set scr_heli_maxhealth 400
set scr_heli_armor 20
map mp_crash
bots 12
until playing 12 60
devhardpoint 0 helicopter_mp
until helicopters 1 200
until heli_shots 1 300
expect heli_shots 1
until heli_crashes 1 600
expect heli_crashes 1
quit
