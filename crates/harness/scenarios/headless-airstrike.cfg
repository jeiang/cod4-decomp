// The airstrike hardpoint with bots: a bot is given the airstrike as a killstreak reward in action slot 4, selects it,
// picks a point on the map and confirms, and the script's call-in is logged. The reward is handed out (as in
// headless-helicopter) because earning it needs five kills without dying, which bots do or do not manage by luck: a
// run of 600 s without one happens at some bot counts.
set g_gametype war
set scr_war_timelimit 0
set scr_war_scorelimit 0
map mp_crash
bots 12
until playing 12 60
devhardpoint 0 airstrike_mp
until airstrikes 1 600
expect airstrikes 1
quit
