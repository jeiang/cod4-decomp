// The airstrike hardpoint with bots: a bot on a five-kill streak is given it in action slot 4,
// selects it, picks a point on the map and confirms, and the script's call-in is logged.
set g_gametype war
set scr_war_timelimit 0
set scr_war_scorelimit 0
map mp_crash
bots 12
until airstrikes 1 600
expect airstrikes 1
quit
