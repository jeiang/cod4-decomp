// Killstreak hardpoints with bots: a bot on a three-kill streak is given the UAV in action slot 4,
// selects it as the key would, and the script's use of it is logged. The server runs unpaced.
set g_gametype war
set scr_war_timelimit 0
set scr_war_scorelimit 0
map mp_crash
bots 12
until hardpoints 1 300
expect hardpoints 1
quit
