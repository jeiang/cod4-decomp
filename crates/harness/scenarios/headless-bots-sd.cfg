// Search and Destroy with bots: the bomb carrier is undefined between pickups, which the
// objective code probes with isAlive(undefined). A script runtime error fails the stage.
set g_gametype sd
set scr_sd_timelimit 0
set scr_sd_scorelimit 0
set scr_sd_roundlimit 0
map mp_crash
bots 20
wait 45s
status
expect kills 1
expect respawns 1
quit
