// Stage 2: headless server, 18 bots play a team deathmatch round on mp_crash to its time
// limit, the match ends and the map rotates.
set g_gametype war
set scr_war_timelimit 2
set scr_war_scorelimit 0
set sv_mapRotation "gametype war map mp_crash gametype war map mp_crash"
map mp_crash
bots 18
wait 100s
status
expect kills 1
expect respawns 1
wait 80s
status
expect rounds 1
quit
