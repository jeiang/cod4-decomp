[package]
name = "client"
description = "Player-facing client."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "cod4e"
path = "src/main.rs"

[dependencies]
assets = { path = "../assets" }
sim = { path = "../sim" }
net = { path = "../net" }
render = { path = "../render" }
server = { path = "../server" }
rav1e = { version = "0.8", default-features = false, features = ["threading"] }
wgpu = "30.0.1"

[dev-dependencies]
pollster = "1.0.1"

[lints]
workspace = true
