[package]
name = "client"
description = "Player-facing client."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "cod4e"
path = "src/main.rs"

[dependencies]
assets = { path = "../assets" }
sim = { path = "../sim" }
net = { path = "../net" }
render = { path = "../render" }
server = { path = "../server" }
rav1e = { version = "0.8", default-features = false, features = ["threading", "asm"] }
wgpu = "30.0.1"
glam = "0.34.1"
png = "0.18.1"
serde_json = "1.0.151"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
winit = "0.30.13"

[dev-dependencies]
pollster = "1.0.1"

[lints]
workspace = true
