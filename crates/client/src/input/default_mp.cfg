// Default key bindings. Applied before the user's config_mp.cfg.
unbindall

bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind space "+gostand"
bind ctrl "+movedown"
bind c "+movedown"
bind z "+prone"
bind shift "+breath_sprint"
bind q "+leanleft"
bind x "+leanright"
bind mouse1 "+attack"
bind mouse2 "+speed_throw"
bind r "+reload"
bind e "+activate"
bind f "+melee"
bind g "+frag"
bind v "+smoke"
// Action slots (d-pad): night vision, claymore, grenade launcher, C4/airstrike/helicopter.
bind n "+actionslot 1"
bind 7 "+actionslot 2"
bind 5 "+actionslot 3"
bind 6 "+actionslot 4"
bind mwheelup "weapnext"
bind mwheeldown "weapprev"
bind 1 "weaponslot 1"
bind 2 "weaponslot 2"
bind 3 "weaponslot 3"
bind 4 "weaponslot 4"
bind tab "+scores"
bind t "say"
bind y "sayteam"
bind escape "togglemenu"

// Keyboard look (also the fly camera's arrows).
bind leftarrow "+left"
bind rightarrow "+right"
bind uparrow "+lookup"
bind downarrow "+lookdown"

// Gamepad.
bind pad_a "+gostand"
bind pad_b "+movedown"
bind pad_x "+reload"
bind pad_y "weapnext"
bind pad_lb "+frag"
bind pad_rb "+smoke"
bind pad_rt "+attack"
bind pad_lt "+speed_throw"
bind pad_ls "+breath_sprint"
bind pad_rs "+melee"
bind pad_start "togglemenu"
bind pad_back "+scores"
bind pad_dpad_up "+activate"
bind pad_dpad_down "+prone"
bind pad_dpad_left "+leanleft"
bind pad_dpad_right "+leanright"
