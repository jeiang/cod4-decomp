// Binds the stock PC config has no counterpart for: keyboard look (also the fly camera's arrows), the mouse wheel
// and the gamepad. Applied after the install's default_mp.cfg, before the profile's config_mp.cfg.
bind leftarrow "+left"
bind rightarrow "+right"
bind uparrow "+lookup"
bind downarrow "+lookdown"
bind mwheelup "weapnext"
bind mwheeldown "weapprev"

bind pad_a "+gostand"
bind pad_b "+movedown"
bind pad_x "+reload"
bind pad_y "weapnext"
bind pad_lb "+frag"
bind pad_rb "+smoke"
bind pad_rt "+attack"
bind pad_lt "+speed_throw"
bind pad_ls "+breath_sprint"
bind pad_rs "+melee"
bind pad_start "togglemenu"
bind pad_back "+scores"
bind pad_dpad_up "+activate"
bind pad_dpad_down "+prone"
bind pad_dpad_left "+leanleft"
bind pad_dpad_right "+leanright"
