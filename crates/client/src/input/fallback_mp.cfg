// Used only when no install is at hand (tests, tools): enough binds to move and shoot. A real run executes the
// install's own default_mp.cfg instead.
unbindall
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind space "+gostand"
bind shift "+breath_sprint"
bind mouse1 "+attack"
bind mouse2 "+toggleads_throw"
bind r "+reload"
bind tab "+scores"
bind escape "togglemenu"
