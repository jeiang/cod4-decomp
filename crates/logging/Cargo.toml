[package]
name = "logging"
description = "The one tracing subscriber setup every binary shares: filter, log file, console forwarding, dedup."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std", "fmt", "env-filter"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "0.3.106", features = ["console"] }
wasm-bindgen = "0.2.129"

[lints]
workspace = true


[dev-dependencies]
tempfile = "3.27.0"
