[package]
name = "web"
description = "Browser entry: renders a map from the user's picked install folder on WebGPU, falling back to WebGL2 (spike for ticket #69)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# Everything here is the wasm32 platform layer; native builds see an empty crate.
[target.'cfg(target_arch = "wasm32")'.dependencies]
assets = { path = "../assets" }
render = { path = "../render" }
console_error_panic_hook = "0.1.7"
glam = "0.34.1"
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3.106", features = ["Blob", "console", "File", "FileReaderSync", "OffscreenCanvas"] }
web-time = "1.1.0"
wgpu = { version = "30.0.1", features = ["webgl"] }

[lints]
workspace = true
