[package]
name = "server"
description = "Authoritative match simulation; no GPU, window, or audio dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "cod4e-server"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
assets = { path = "../assets" }
gsc = { path = "../gsc" }
sim = { path = "../sim" }
net = { path = "../net", features = ["webtransport"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
sim = { path = "../sim", features = ["test-support"] }
wtransport = "0.7.2"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
